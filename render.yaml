services:
  - type: web
    name: marketplace-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: marketplace
    buildCommand: npm install && npm run build:cloud && cd backend && npx prisma db push --accept-data-loss && npm run db:seed -w backend
    startCommand: npm run start:cloud
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REDIS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
